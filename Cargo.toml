[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
wgpu = "=27.0.1"
winit = "=0.30.12"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
